services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 15

  # Migrations run once, as their own service, before anything that touches
  # the schema. The API refuses to boot against an unmigrated database, and
  # the worker queries the same tables — so both wait for this to succeed
  # rather than racing it. Two API replicas would otherwise both try to
  # migrate on startup.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://vault:vault@db:5432/vault
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://vault:vault@db:5432/vault
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3100,http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)\""]
      interval: 10s
      retries: 5

  worker:
    build: .
    command: arq worker.tasks.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://vault:vault@db:5432/vault
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
